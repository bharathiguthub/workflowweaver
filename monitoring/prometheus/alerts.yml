# Sample alerts (Phase 8.6). They are evaluated by Prometheus and shown in Prometheus (Alerts)
# and Grafana. No Alertmanager / notification channel is configured - add one to page anyone.
groups:
  - name: workflowweaver
    rules:
      - alert: WorkflowWeaverApiDown
        expr: up{job="workflowweaver-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WorkflowWeaver API is not being scraped
          description: Prometheus cannot reach /metrics on the API for 2 minutes.

      - alert: HighApiErrorRate
        expr: |
          (
            sum(rate(ww_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ww_http_requests_total[5m])), 1e-9)
          ) > 0.05
          and sum(rate(ww_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests fail with 5xx
          description: "5xx ratio over 5 minutes: {{ $value | humanizePercentage }}."

      - alert: SlowWorkflowExecutions
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ww_workflow_execution_duration_seconds_bucket[15m]))) > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Workflow executions are slow (p95 above 2 minutes)
          description: "p95 execution duration over 15 minutes: {{ $value | humanizeDuration }}."

      - alert: SlowPlanning
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ww_workflow_planning_duration_seconds_bucket[15m]))) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Planning is slow (p95 above 60 seconds)

      - alert: IntegrationFailures
        expr: sum by (integration) (increase(ww_integration_failures_total[10m])) > 3
        labels:
          severity: warning
        annotations:
          summary: "Repeated {{ $labels.integration }} step failures"
          description: "{{ $value | humanize }} failed step attempts in 10 minutes."

      - alert: CompensationFailures
        expr: sum(increase(ww_compensations_total{outcome="failed"}[30m])) > 0
        labels:
          severity: critical
        annotations:
          summary: A rollback (compensation) failed - manual cleanup may be required

      - alert: LlmFallbackSpike
        expr: sum(increase(ww_llm_fallbacks_total[15m])) > 5
        labels:
          severity: info
        annotations:
          summary: The primary AI planner keeps falling back
          description: "{{ $value | humanize }} fallbacks in 15 minutes (rate limits, timeouts or provider errors)."
